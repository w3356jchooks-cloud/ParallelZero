<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ParallelZero — Remote Server Mode</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b21;
      --accent: #ef4444;
      --danger: #f87171;
      --warn: #facc15;
      --ok: #22c55e;
      --cyan: #38bdf8;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --light-sq: #ebecd0;
      --dark-sq: #739552;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px;
      min-height: 100vh;
      overflow-y: auto;
    }
    .panel {
      width: 100%;
      max-width: 390px;
      max-height: 98vh;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid #262b34;
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
      position: relative;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .header h1 {
      font-size: 0.86rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text);
    }
    .header h1 span { color: var(--accent); }
    .badge {
      font-size: 0.58rem;
      padding: 3px 7px;
      border-radius: 99px;
      background: #232832;
      color: var(--ok);
      font-weight: 700;
      border: 1px solid rgba(34, 197, 94, 0.35);
    }

    .clocks-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      margin-bottom: 6px;
      background: #12151a;
      padding: 4px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      text-align: center;
    }
    .clock { padding: 3px; border-radius: 6px; background: #181b21; color: var(--muted); }
    .clock.active { background: #262b35; color: var(--warn); border: 1px solid var(--warn); }

    .side-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-bottom: 6px;
      background: #12151a;
      padding: 3px;
      border-radius: 8px;
    }
    .side-btn {
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }
    .side-btn.active { background: #262b35; color: var(--text); }

    .turn-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #12151a;
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .turn-indicator { color: var(--warn); }
    .status-alert { color: var(--danger); font-weight: 800; }

    .result-box {
      background: #12151a;
      border: 1px solid #262b34;
      border-radius: 8px;
      padding: 7px;
      text-align: center;
      margin-bottom: 7px;
    }
    .best-move {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.5px;
    }
    .prediction-text {
      font-size: 0.64rem;
      color: var(--cyan);
      margin-top: 4px;
      line-height: 1.3;
      background: #0d0f13;
      padding: 5px 6px;
      border-radius: 4px;
      text-align: left;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      min-height: 32px;
      max-height: 54px;
      overflow-y: auto;
    }
    
    .board-container {
      width: 100%;
      aspect-ratio: 1 / 1;
      margin-bottom: 7px;
      position: relative;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 100%;
      height: 100%;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #2d333f;
    }
    .sq {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(22px, 6vw, 30px);
      user-select: none;
      cursor: pointer;
      width: 100%;
      height: 100%;
      position: relative;
    }
    .sq.light { background: var(--light-sq); color: #111; }
    .sq.dark { background: var(--dark-sq); color: #111; }
    .sq.selected { outline: 3px solid var(--warn); z-index: 2; }
    .sq.highlight { box-shadow: inset 0 0 0 4px rgba(239, 68, 68, 0.9); }
    .sq.in-check { background: radial-gradient(circle, #ef4444 25%, transparent 75%), var(--light-sq); }
    .sq.dark.in-check { background: radial-gradient(circle, #ef4444 25%, transparent 75%), var(--dark-sq); }

    .controls {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 5px;
    }
    button.action-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 4px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary { background: #232832; color: var(--text); }
  </style>
</head>
<body>

<div class="panel">
  <div class="header">
    <h1>⚡ PARALLEL<span>ZERO</span></h1>
    <span class="badge" id="serverStatus">Server API Active</span>
  </div>

  <div class="clocks-bar">
    <div class="clock" id="whiteClock">White: 60:00</div>
    <div class="clock" id="blackClock">Black: 60:00</div>
  </div>

  <div class="side-toggle">
    <button class="side-btn active" id="whiteBtn">⚪ You: White</button>
    <button class="side-btn" id="blackBtn">⚫ You: Black</button>
  </div>

  <div class="turn-bar">
    <span class="turn-indicator" id="turnDisplay">⚪ WHITE TO MOVE</span>
    <span class="status-alert" id="gameAlert"></span>
  </div>

  <div class="result-box">
    <div class="best-move" id="bestMoveDisplay">Ready (Server Mode)</div>
    <div class="prediction-text" id="predictionDisplay">Remote Stockfish server connected via API.</div>
  </div>

  <div class="board-container">
    <div class="board" id="chessBoard"></div>
  </div>

  <div class="controls">
    <button class="action-btn" id="forceBtn">🤖 Force Bot</button>
    <button class="action-btn secondary" id="undoBtn">↩️ Undo</button>
    <button class="action-btn secondary" id="resetBtn">🗑️ Reset</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
  const game = new Chess();
  let playerColor = 'w';
  let selectedSquare = null;
  let bestFrom = null;
  let bestTo = null;
  let gameStarted = false;
  let isBotThinking = false;
  let gameFinishedByTimeout = false;
  let gameStartedAt = null;
  let analysisRequestId = 0;

  let whiteTimeRemaining = 3600;
  let blackTimeRemaining = 3600;
  let gameClockInterval = null;

  const pieceUnicode = {
    p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚',
    P: '♙', R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔'
  };

  async function queryRemoteStockfishServer() {
    if (isGameFinished() || isBotThinking) return;
    if (!gameStarted) {
      gameStarted = true;
      gameStartedAt = Date.now();
      startGameClock();
    }
    isBotThinking = true;
    const requestId = ++analysisRequestId;
    const requestedFen = game.fen();
    document.getElementById('bestMoveDisplay').textContent = 'Six calculators analyzing...';
    document.getElementById('predictionDisplay').textContent =
      'Sending the same position to six ChessDrive calculators (depths 38, 38, 37, 37, 37, 37; five lines each).';
    try {
      const response = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fen: requestedFen })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `Analysis request failed (${response.status})`);
      if (requestId !== analysisRequestId || requestedFen !== game.fen()) return;
      if (!data.move || !data.move.from || !data.move.to) throw new Error('The local selector did not return a valid move.');
      const executed = game.move({
        from: data.move.from,
        to: data.move.to,
        promotion: data.move.promotion || 'q'
      });
      if (!executed) throw new Error('Chess.js rejected the selected move. No move was played.');
      bestFrom = executed.from;
      bestTo = executed.to;
      document.getElementById('bestMoveDisplay').textContent = `ParallelZero Move: ${executed.san}`;
      const scoreText = data.selection && data.selection.scoreLabel ? data.selection.scoreLabel : 'Evaluation unavailable';
      const voteText = data.selection ? `${data.selection.votes}/6 calculators selected this move` : 'Selected by the local calculator';
      document.getElementById('predictionDisplay').textContent =
        `${scoreText} | ${voteText} | 6/6 calculations completed`;
      updateBoardState(true);
    } catch (err) {
      if (requestId === analysisRequestId) {
        document.getElementById('bestMoveDisplay').textContent = 'Analysis unavailable';
        document.getElementById('predictionDisplay').textContent = err.message;
      }
    } finally {
      if (requestId === analysisRequestId) {\n        isBotThinking = false;\n        checkServerStatus();\n      }
    }
  }

  function isGameFinished() {
    return game.game_over() || gameFinishedByTimeout;
  }

  async function checkServerStatus() {
    const badge = document.getElementById('serverStatus');
    try {
      const response = await fetch('/api/analyze', { method: 'GET' });
      const status = await response.json();
      if (status.configMissing) {
        badge.textContent = 'Backend Setup Needed';
        badge.classList.remove('ready');
      } else if (status.paused) {
        badge.textContent = 'Daily Pause';
        badge.classList.remove('ready');
      } else if (status.busy) {\n        badge.textContent = 'Calculators Busy';\n        badge.classList.remove('ready');\n      } else if (status.available) {
        badge.textContent = '6 Calculators Ready';
        badge.classList.add('ready');
      } else {
        badge.textContent = 'Server Unavailable';
        badge.classList.remove('ready');
      }
    } catch (_) {
      badge.textContent = 'Backend Offline';
      badge.classList.remove('ready');
    }
  }

  function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
  }

  function updateClocksDisplay() {
    document.getElementById('whiteClock').textContent = `White: ${formatTime(whiteTimeRemaining)}`;
    document.getElementById('blackClock').textContent = `Black: ${formatTime(blackTimeRemaining)}`;
    const turn = game.turn();
    document.getElementById('whiteClock').classList.toggle('active', gameStarted && turn === 'w' && !game.game_over());
    document.getElementById('blackClock').classList.toggle('active', gameStarted && turn === 'b' && !game.game_over());
  }

  function startGameClock() {
    if (gameClockInterval) clearInterval(gameClockInterval);
    gameClockInterval = setInterval(() => {
      if (!gameStarted || isGameFinished()) return;
      if (gameStartedAt && Date.now() - gameStartedAt >= 60 * 60 * 1000) {
        finishByTimeout('60-MINUTE GAME LIMIT');
        return;
      }
      if (game.turn() === 'w') {
        whiteTimeRemaining = Math.max(0, whiteTimeRemaining - 1);
        if (whiteTimeRemaining === 0) { finishByTimeout('WHITE TIMEOUT'); return; }
      } else {
        blackTimeRemaining = Math.max(0, blackTimeRemaining - 1);
        if (blackTimeRemaining === 0) { finishByTimeout('BLACK TIMEOUT'); return; }
      }
      updateClocksDisplay();
    }, 1000);
  }

  function finishByTimeout(message) {
    gameFinishedByTimeout = true;
    analysisRequestId++;
    isBotThinking = false;
    if (gameClockInterval) clearInterval(gameClockInterval);
    document.getElementById('gameAlert').textContent = message;
    document.getElementById('bestMoveDisplay').textContent = 'Game finished';
    document.getElementById('predictionDisplay').textContent = 'No further calculator requests will be made for this game.';
    updateClocksDisplay();
  }

  function setPlayerColor(color) {
    playerColor = color;
    whiteTimeRemaining = 3600;
    blackTimeRemaining = 3600;
    gameStarted = false;
    gameStartedAt = null;
    gameFinishedByTimeout = false;
    analysisRequestId++;
    isBotThinking = false;
    if (gameClockInterval) clearInterval(gameClockInterval);
    selectedSquare = null;
    bestFrom = null;
    bestTo = null;
    document.getElementById('whiteBtn').classList.toggle('active', color === 'w');
    document.getElementById('blackBtn').classList.toggle('active', color === 'b');
    updateBoardState(false);
  }

  function updateBoardState(autoTriggerBot = true) {
    const turnEl = document.getElementById('turnDisplay');
    const alertEl = document.getElementById('gameAlert');
    const currentTurn = game.turn();

    turnEl.textContent = currentTurn === 'w' ? '⚪ WHITE TO MOVE' : '⚫ BLACK TO MOVE';
    alertEl.textContent = '';
    renderBoard();
    updateClocksDisplay();

    if (gameFinishedByTimeout) {
      alertEl.textContent = 'TIME EXPIRED';
      return;
    }
    if (game.game_over() && gameClockInterval) clearInterval(gameClockInterval);
    if (game.in_checkmate()) {
      alertEl.textContent = 'CHECKMATE!';
      return;
    }
    if (game.in_check()) alertEl.textContent = '⚠️ CHECK!';

    if (gameStarted && autoTriggerBot && currentTurn !== playerColor) {
      queryRemoteStockfishServer();
    } else if (!gameStarted) {
      document.getElementById('bestMoveDisplay').textContent = 'Ready (Server Mode)';
    }
  }

  function renderBoard() {
    const boardEl = document.getElementById('chessBoard');
    boardEl.innerHTML = '';
    const files = ['a','b','c','d','e','f','g','h'];
    const ranks = ['8','7','6','5','4','3','2','1'];

    if (playerColor === 'b') { files.reverse(); ranks.reverse(); }

    for (let r = 0; r < 8; r++) {
      for (let f = 0; f < 8; f++) {
        const sqName = files[f] + ranks[r];
        const sqEl = document.createElement('div');
        const isLight = (files.indexOf(files[f]) + ranks.indexOf(ranks[r])) % 2 === 0;

        sqEl.className = `sq ${isLight ? 'light' : 'dark'}`;
        if (selectedSquare === sqName) sqEl.classList.add('selected');
        if (sqName === bestFrom || sqName === bestTo) sqEl.classList.add('highlight');

        const piece = game.get(sqName);
        if (piece) {
          const key = piece.color === 'w' ? piece.type.toUpperCase() : piece.type.toLowerCase();
          sqEl.textContent = pieceUnicode[key];
        }

        sqEl.onclick = () => onSquareClick(sqName);
        boardEl.appendChild(sqEl);
      }
    }
  }

  function onSquareClick(sqName) {
    if (game.game_over() || isBotThinking) return;

    if (!selectedSquare) {
      const piece = game.get(sqName);
      if (piece && piece.color === game.turn()) {
        selectedSquare = sqName;
        renderBoard();
      }
      return;
    }

    const move = game.move({ from: selectedSquare, to: sqName, promotion: 'q' });
    selectedSquare = null;

    if (move) {
      if (!gameStarted) { gameStarted = true; gameStartedAt = Date.now(); startGameClock(); }
      bestFrom = null;
      bestTo = null;
      updateBoardState(true);
    } else {
      const piece = game.get(sqName);
      if (piece && piece.color === game.turn()) {
        selectedSquare = sqName;
      }
      renderBoard();
    }
  }

  document.getElementById('whiteBtn').addEventListener('click', () => setPlayerColor('w'));
  document.getElementById('blackBtn').addEventListener('click', () => setPlayerColor('b'));
  document.getElementById('forceBtn').addEventListener('click', queryRemoteStockfishServer);
  document.getElementById('undoBtn').addEventListener('click', () => {
    analysisRequestId++;
    isBotThinking = false;
    game.undo();
    gameFinishedByTimeout = false;
    if (gameClockInterval) clearInterval(gameClockInterval);
    gameStarted = game.history().length > 0;
    gameStartedAt = gameStarted ? Date.now() : null;
    if (gameStarted) startGameClock();
    updateBoardState(false);
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    analysisRequestId++;
    isBotThinking = false;
    game.reset();
    gameStarted = false;
    gameStartedAt = null;
    gameFinishedByTimeout = false;
    whiteTimeRemaining = 3600;
    blackTimeRemaining = 3600;
    selectedSquare = null;
    bestFrom = null;
    bestTo = null;
    if (gameClockInterval) clearInterval(gameClockInterval);
    updateBoardState(false);
  });

  renderBoard();
  checkServerStatus();
</script>
</body>
</html>
